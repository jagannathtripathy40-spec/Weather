<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Weather App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="weather-card">
    <div class="search-box">
      <input type="text" id="city-input" placeholder="Enter city name..." />
      <button id="search-btn">Search</button>
    </div>

    <div id="error-message" class="error hidden">City not found. Try again.</div>

    <div id="weather-info" class="weather-info hidden">
      <h2 id="city-name">--</h2>
      <div class="temp" id="temperature">--°C</div>
      <p class="condition" id="condition">--</p>
      
      <div class="details">
        <div>
          <span>Humidity</span>
          <strong id="humidity">--%</strong>
        </div>
        <div>
          <span>Wind Speed</span>
          <strong id="wind">-- km/h</strong>
        </div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
